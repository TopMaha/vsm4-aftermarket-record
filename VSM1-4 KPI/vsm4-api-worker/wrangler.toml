# vsm4-api — Unified backend ของ VSM1-4 KPI (ดาวน์โหลด source จาก Cloudflare 2026-07-16
# แล้วแก้: idempotent insert ตาม record_id + คอลัมน์ machine_id/zone/vsm ใน production_records)
# deploy:  npx wrangler deploy   (ต้อง copy index.html ล่าสุดจาก repo root มาไว้โฟลเดอร์นี้ก่อน
#          เพราะ Worker เสิร์ฟหน้าแอปที่ root ด้วย — ดู build-deploy.ps1)
name = "vsm4-api"
main = "worker.js"
compatibility_date = "2024-11-01"

# ⚡ 2026-09-02 — Workers Caching: Cloudflare คืนคำตอบที่ cache ไว้ "โดยไม่รัน Worker เลย"
#   ทำไมถึงจำเป็น: D1 free tier จำกัด 5,000,000 rows read/วัน และ 2026-09-02 ชนเพดานจนซิงก์ล้มทั้งระบบ
#   ตัวที่กินคือคำขอก้อนประวัติทั้งหมด (SCAN เต็มตาราง ~20,000 แถว/คำขอ) ซึ่งทุกเครื่องขอ URL เดียวกันเป๊ะ
#   ได้ 2 อย่างที่ Cache API (caches.default) ให้ไม่ได้:
#     ① cache hit = ไม่รัน Worker = ไม่แตะ D1 เลยสักแถว
#     ② request collapsing — 20 เครื่องเปิดแอปพร้อมกันตอนเปลี่ยนกะ = สแกน D1 รอบเดียว ไม่ใช่ 20 รอบ
#   คุมด้วย Cache-Control ในโค้ดล้วน ๆ: json() ตั้งต้น no-store · เฉพาะที่ servedCached ครอบเท่านั้น
#   ที่เป็น public, max-age=N (ดู worker.js) ⇒ ไม่มีทางเผลอ cache คำขอที่ต้องเห็นของสด
#   ต้องใช้ wrangler ≥ 4.69.0 (เครื่องนี้ 4.128.0)
[cache]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "kpi-vsm4-db"
database_id = "00e2e19b-977c-48bc-b9cc-57604b6c6f09"

# ให้ import './index.html' ได้ (โมดูลข้อความ — เหมือนที่ deploy ไว้เดิม)
[[rules]]
type = "Text"
globs = ["**/*.html"]
